name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install keyring dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p oxfer-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="oxfer-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin=oxfer; [ "${{ matrix.os }}" = windows-latest ] && bin=oxfer.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          # shell completions and man page generated from the built binary
          if [ "${{ matrix.os }}" != windows-latest ]; then
            mkdir -p "$name/completions"
            for sh in bash zsh fish; do "$name/$bin" completions $sh > "$name/completions/oxfer.$sh"; done
            "$name/$bin" man > "$name/oxfer.1"
          fi
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the frontend
        working-directory: ui
        run: npm ci && npm run build
      - name: Build oxfer.app (universal)
        working-directory: crates/oxfer-gui
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app
      # The signing certificate is the self-signed "oxfer local signing"
      # identity, exported as a base64 .p12 (see README, "Releasing").
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::secret MACOS_SIGNING_P12 is not set (see README, Releasing)"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "OXFER_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Sign and package
        run: |
          dmg="oxfer-${GITHUB_REF_NAME}-macos-universal.dmg"
          scripts/package-macos-dmg.sh target/universal-apple-darwin/release/bundle/macos/oxfer.app "$dmg"
          echo "ASSET=$dmg" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

  formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Homebrew formula from the published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir archives
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --dir archives
          scripts/gen-formula.sh "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME#v}" archives > oxfer.rb
          cat oxfer.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: oxfer.rb
