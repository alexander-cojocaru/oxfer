name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # No GitHub-hosted runners are used (minutes are exhausted): Linux and
  # Windows archives build on the self-hosted Linux x64 runner (Windows via
  # cargo-xwin), macOS ones on the self-hosted macOS runner.
  build-linux:
    runs-on: [self-hosted, linux, x64]
    env:
      TARGETS: x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-xwin
        run: command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin
      - name: Build
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: |
          cargo build --release -p oxfer-cli --target x86_64-unknown-linux-gnu
          cargo xwin build --release -p oxfer-cli --target x86_64-pc-windows-msvc
      - name: Package
        run: |
          native="target/x86_64-unknown-linux-gnu/release/oxfer"
          mkdir -p extras/completions
          for sh in bash zsh fish; do "$native" completions $sh > "extras/completions/oxfer.$sh"; done
          "$native" man > extras/oxfer.1
          for target in $TARGETS; do
            name="oxfer-${GITHUB_REF_NAME}-$target"
            mkdir "$name"
            case "$target" in
              *windows*) cp "target/$target/release/oxfer.exe" "$name/" ;;
              *) cp "target/$target/release/oxfer" "$name/"; cp -r extras/completions extras/oxfer.1 "$name/" ;;
            esac
            cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
            case "$target" in
              *windows*) python3 -m zipfile -c "$name.zip" "$name" ;;
              *) tar czf "$name.tar.gz" "$name" ;;
            esac
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            oxfer-*.tar.gz
            oxfer-*.zip

  build-macos:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release -p oxfer-cli --target x86_64-apple-darwin
          cargo build --release -p oxfer-cli --target aarch64-apple-darwin
      - name: Package
        run: |
          # Completions and the man page are platform independent: generate
          # them once from the binary matching this machine's architecture.
          host="$(uname -m)"; [ "$host" = arm64 ] && host=aarch64
          native="target/$host-apple-darwin/release/oxfer"
          mkdir -p extras/completions
          for sh in bash zsh fish; do "$native" completions $sh > "extras/completions/oxfer.$sh"; done
          "$native" man > extras/oxfer.1
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            name="oxfer-${GITHUB_REF_NAME}-$target"
            mkdir "$name"
            cp "target/$target/release/oxfer" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            cp -r extras/completions extras/oxfer.1 "$name/"
            tar czf "$name.tar.gz" "$name"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: oxfer-*-apple-darwin.tar.gz

  macos-app:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the frontend
        working-directory: ui
        run: npm ci && npm run build
      - name: Build oxfer.app (universal)
        working-directory: crates/oxfer-gui
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app
      # The signing certificate is the self-signed "oxfer local signing"
      # identity, exported as a base64 .p12 (see README, "Releasing").
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::secret MACOS_SIGNING_P12 is not set (see README, Releasing)"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "OXFER_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Sign and package
        run: |
          dmg="oxfer-${GITHUB_REF_NAME}-macos-universal.dmg"
          scripts/package-macos-dmg.sh target/universal-apple-darwin/release/bundle/macos/oxfer.app "$dmg"
          echo "ASSET=$dmg" >> "$GITHUB_ENV"
      # The in-app updater downloads the signed app as .app.tar.gz and verifies
      # it against the public key in tauri.conf.json (see README, "Releasing").
      - name: Build the updater archive and manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set (see README, Releasing)"
            exit 1
          fi
          archive="oxfer-${GITHUB_REF_NAME}-macos-universal.app.tar.gz"
          tar -czf "$archive" -C target/universal-apple-darwin/release/bundle/macos oxfer.app
          npx --yes @tauri-apps/cli@2 signer sign "$archive"
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          scripts/gen-latest-json.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$archive" "$archive.sig" release-notes.md > latest.json
          cat latest.json
          echo "UPDATER_ASSET=$archive" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.UPDATER_ASSET }}
            latest.json
      # The runner is a personal Mac: do not leave the temporary keychain behind.
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          [ -n "$OXFER_SIGN_KEYCHAIN" ] && security delete-keychain "$OXFER_SIGN_KEYCHAIN" || true

  formula:
    needs: [build-linux, build-macos]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Render Homebrew formula from the published archives
        # The self-hosted runner has no gh CLI, so fetch the archives with curl.
        run: |
          mkdir archives
          for triple in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            f="oxfer-$GITHUB_REF_NAME-$triple.tar.gz"
            curl -fsSL --retry 3 -o "archives/$f" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$f"
          done
          scripts/gen-formula.sh "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME#v}" archives > oxfer.rb
          cat oxfer.rb
      # Release notes come from the CHANGELOG.md section of the tag; the step
      # fails when there is none, so every release has to be described.
      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" | tee release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: oxfer.rb
          body_path: release-notes.md
