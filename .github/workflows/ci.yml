name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","linux","x64"]') || fromJSON('["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install keyring dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # oxfer-gui (Tauri) needs webview system libraries; it has its own job.
      - run: cargo clippy --workspace --exclude oxfer-gui --all-targets
      - run: cargo test --workspace --exclude oxfer-gui

  gui:
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'linux' && fromJSON('["self-hosted","linux","x64"]') || fromJSON('["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo clippy -p oxfer-gui --all-targets -- -D warnings
      - run: cargo test -p oxfer-gui

  # No Windows runner is available: type-check and lint the Windows target by
  # cross-compiling on the Linux runner (tests cannot run there).
  windows:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin
      - run: cargo xwin clippy --workspace --exclude oxfer-gui --all-targets --target x86_64-pc-windows-msvc --xwin-accept-license
