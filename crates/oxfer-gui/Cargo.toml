[package]
name = "oxfer-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "oxfer desktop GUI (Tauri 2)"
publish = false

[lib]
name = "oxfer_gui"
path = "src/lib.rs"

[[bin]]
name = "oxfer-gui"
path = "src/main.rs"

[features]
# Serve the embedded `ui/dist` through Tauri's custom protocol (production
# mode) even for a plain `cargo build`; there is no dev server URL configured.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
oxfer-core.workspace = true
oxfer-sftp.workspace = true
oxfer-ftp.workspace = true
oxfer-config = { path = "../oxfer-config" }
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
directories = "5"
tauri = { version = "2.12", features = [] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
oxfer-testutil = { path = "../oxfer-testutil" }
tempfile = "3"
