[package]
name = "oxfer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxfer-core.workspace = true
oxfer-sftp.workspace = true
oxfer-ftp.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
indicatif = "0.18.6"
rustyline = { version = "18.0.1", features = ["derive"] }
shell-words = "1.1.1"
directories = "6.0.0"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
oxfer-config = { version = "0.1.0", path = "../oxfer-config" }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
oxfer-testutil = { path = "../oxfer-testutil" }
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.16.2"

[[bin]]
name = "oxfer"
path = "src/main.rs"
