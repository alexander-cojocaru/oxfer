[package]
name = "oxfer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxfer-core.workspace = true
oxfer-sftp.workspace = true
oxfer-ftp.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
indicatif = "0.18.6"

[dev-dependencies]
oxfer-testutil = { path = "../oxfer-testutil" }
tempfile = "3.27.0"

[[bin]]
name = "oxfer"
path = "src/main.rs"
