[package]
name = "oxfer-ftp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxfer-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
suppaftp = { version = "12.1.1", features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws-lc-rs"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
proptest = "1.11.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
