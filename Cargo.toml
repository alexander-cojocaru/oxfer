[workspace]
resolver = "2"
members = ["crates/*"]
# oxfer-gui (Tauri) needs system webview libraries (webkit2gtk on Linux) and
# the built frontend; it is left out of plain `cargo build/test`. Use
# `-p oxfer-gui` to build it explicitly.
default-members = [
    "crates/oxfer-cli",
    "crates/oxfer-config",
    "crates/oxfer-core",
    "crates/oxfer-ftp",
    "crates/oxfer-sftp",
    "crates/oxfer-testutil",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
oxfer-core = { path = "crates/oxfer-core" }
oxfer-sftp = { path = "crates/oxfer-sftp" }
oxfer-ftp = { path = "crates/oxfer-ftp" }
